<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Finance Dashboard - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center">urFinance</h1>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div id="auth-forms">
          <div id="login-form">
            <h2>Login</h2>
            <form id="login">
              <input type="email" id="login-email" placeholder="Email" required class="form-control mb-2">
              <input type="password" id="login-password" placeholder="Password" required class="form-control mb-2">
              <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <p><a href="#" onclick="showRegister()">Don't have an account? Register</a></p>
          </div>
          <div id="register-form" style="display:none;">
            <h2>Register</h2>
            <form id="register">
              <input type="text" id="reg-username" placeholder="Username" required class="form-control mb-2">
              <input type="email" id="reg-email" placeholder="Email" required class="form-control mb-2">
              <input type="password" id="reg-password" placeholder="Password" required class="form-control mb-2">
              <button type="submit" class="btn btn-success">Register</button>
            </form>
            <p><a href="#" onclick="showLogin()">Already have an account? Login</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
